# .github/workflows/keep_alive.yml
name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping
        run: |
          curl -s -L "https://YOUR-APP-NAME.streamlit.app" > /dev/null
