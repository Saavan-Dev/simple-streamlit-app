# .github/workflows/keep_alive.yml
name: Keep Multiple Streamlit Apps Alive

on:
  schedule:
    # Runs every 8 hours (adjust as needed)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  wake-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Prevents one failing app from stopping others
      matrix:
        app-url:
          - "https://jbpnqsmkdkrwgejshyhukx.streamlit.app/"
          - "https://fitnessappbysg.streamlit.app/"
          - "https://webscrapingwiki.streamlit.app/"
          - "https://expensetrackerapp.streamlit.app/"
          - "https://movieticketapp.streamlit.app/"
          - "https://universalfileviewer.streamlit.app/"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7        # ✅ Node 24

      - name: Set up Python
        uses: actions/setup-python@v7    # ✅ Node 24
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Playwright and dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Ping and Wake App
        run: |
          python wake_apps.py "${{ matrix.app-url }}"
