name: DB keep-alive

on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours
  workflow_dispatch:         # adds a manual "Run workflow" button

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 #latest node version
      - uses: actions/setup-python@v7 #latest node version
        with: { python-version: "3.12" }
      - run: pip install sqlalchemy pymysql
      - run: python db_keepalive.py
        env:
          DB_DRIVERNAME: ${{ secrets.DRIVERNAME }}
          DB_USERNAME:   ${{ secrets.USERNAME }}
          DB_PASSWORD:   ${{ secrets.PASSWORD }}
          DB_HOST:       ${{ secrets.HOSTNAME }}
          DB_PORT:       ${{ secrets.PORT }}
          DB_DATABASE:   ${{ secrets.DATABASE }}
