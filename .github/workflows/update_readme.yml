name: Update README app links

on:
  push:
    branches: [main]
    paths:                                  # run only when these files change
      - ".github/workflows/keep_alive.yml"
      - "update_readme.py"
  workflow_dispatch:                        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write                           # allows the bot to commit README.md

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the app table
        run: python update_readme.py

      - name: Commit README.md if it changed
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update live app links"
          git push
